name: Windows source validation
run-name: "Windows source validation | ${{ github.sha }}"

on:
  push:
    branches: ['desktop/source-validation-*']

permissions:
  contents: read

concurrency:
  group: windows-source-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-validation:
    if: github.repository == 'tonysuper666-creator/BiliPai-Windows' && github.event.repository.private == false
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Set checkout path and newline policy
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Windows subprocesses, runtime staging and original collection seams
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONIOENCODING: utf-8
          PYTHONPATH: ${{ github.workspace }}/desktop/tools
        run: |
          python -c "import shutil; assert shutil.which('pwsh') and shutil.which('powershell.exe'), 'Both real PowerShell hosts are required'"
          if ($LASTEXITCODE -ne 0) { throw 'Verifier subprocess preflight failed.' }
          python desktop/tools/run-tool-tests.py --stage policies
          if ($LASTEXITCODE -ne 0) { throw 'Complete source inventory, updater and publication policy regressions failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_extract_upstream_command_attention.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Original whole engagement and follow projection regressions failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_extract_upstream_owner_follow.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Original UP preview retry and current-owner caller regressions failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_package_source_qualification.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Source and harness qualification regression failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_validate_source_cohort.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Frozen source inventory regression failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_export_packaged_updater_harness.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Updater harness export boundary regression failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_verify_updater_harness_export.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Updater harness artifact readback regression failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_veyra_verifier_child_environment.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Actual verifier subprocess regression failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_mpv_companion_resource_staging.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Verified MPV companion packaging regression failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_mpv_rtx_installer_protocol.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Current and retired NVIDIA presentation source admission regression failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_native_cares_recipe.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Explicit c-ares source branch selection regression failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_v038_listen_collection_source.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Original collection source adaptation regression failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_v038_audio_library_source.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Original audio library source adaptation regression failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_v038_listen_viewmodel_source.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Original Listen state machine source adaptation regression failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_v038_listen_screen_source.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Original Listen screen source adaptation regression failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_v038_danmaku_merge_source.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Shared original semantic color closure regression failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_v041_feed_images_source.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Original v041 feed-image source/test generation regression failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_v041_feed_store_source.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Complete v041 feed Store/import source regression failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_extract_upstream_plugins.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Actual original plugin source producer regression failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_extract_upstream_js.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Actual original JS source producer regression failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_v040_dynamic_pagination_source.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Original dynamic pagination decision regression failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_dynamic_timeline_sources.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Existing timeline source regression failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_dynamic_tabs_sources.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Original tabs source ownership regression failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_v041_dynamic_author_search_source.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Whole original v041 dynamic author-search source regression failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_v042_search_layout_source.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Whole current Search layout source regression failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_v042_search_dependencies_source.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Whole current Search dependency source regression failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_v042_optical_dependencies_source.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Whole current Search and shared glass geometry source regression failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_v042_network_proxy_source.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Whole current domain proxy source and Windows preference contract failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_extract_upstream_brand_callers.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Whole brand caller source and historical empty-state contracts failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_v042_seed_palette_source.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Whole original seed palette and shared endpoint source regressions failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_v043_theme_chrome_source.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Original v043 theme, transparent control and measured native tab closure failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_v046_danmaku_like_source.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Original v046 danmaku-like declaration and existing API ownership regressions failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_v046_favorite_editor_source.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Original folder metadata and captured editor source regressions failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_v044_favorite_detail_source.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Current original favorite detail, live UI, ownership and playlist model source failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_v044_favorite_subscription_source.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Current original subscription lifecycle, repository, material and input closure failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_v044_favorite_search_source.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Current original subscribed search navigation, restoration and caller contract failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_v044_audio_routes_source.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Current original collection audio routing, restoration and producer contract failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_v044_fans_source.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Current original native fans page, owned API, Root caller and complete navigation source contract failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_v044_following_source.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Current original following on-demand pagination, retained cache ownership, complete UI and original suites contract failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_v044_list_foreground_source.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Current original physical-page list paging gates and sole real callers contract failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_v044_navigation_contracts_source.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Complete original navigation codec and unchanged whole22-case original regression suite contract failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_windows_audio_output_focus_sources.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Physical audio lease and actual native actor wiring regressions failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_android_backup_format_sources.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Original Android backup format, official Preferences schema, retained licenses and real Root restore wiring contract failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_extract_upstream_brand_history.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Full original history/list source stages and authenticated baseline recovery failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_v040_theme_roles_source.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Complete original theme-role source regression failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_v040_liquid_controls_source.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Original liquid value control source ownership regression failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_v040_chrome_actions_source.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Original chrome action source ownership regression failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_v040_native_chrome_source.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Original native chrome and shared lens source regression failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_v040_player_cover_source.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Original player cover policy, caller and source ownership regression failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_v041_player_cover_source.py -v
          if ($LASTEXITCODE -ne 0) { throw "Current original player cover source regressions failed" }
          python -m unittest discover -s desktop/tools/tests -p test_v040_player_tap_source.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Original player tap stream and caller source ownership regression failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_extract_upstream_offline_error_v029.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Original offline policy and Windows mouse/source ownership adaptation regression failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_v040_reply_medal_source.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Shared reply medal and retained source regression failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_v029_comment_search.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Shared reply medal and retained source regression failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_v029_reply_renderer.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Shared reply medal and retained source regression failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_extract_upstream_dynamic_reply.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Shared reply medal and retained source regression failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_v041_dynamic_comment_identity_source.py -v
          if ($LASTEXITCODE -ne 0) { throw "Dynamic comment identity source regressions failed" }
      - name: Validate retained original PGC Screen mount source
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONIOENCODING: utf-8
        run: |
          python -m unittest discover -s desktop/tools/tests -p test_windows_pgc_screen_mount.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Complete original PGC Screen mount source regressions failed.' }
      - name: Check offline original Root UI harness export boundaries
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONIOENCODING: utf-8
        run: |
          python -m unittest discover -s desktop/tools/tests -p test_original_root_ui_class_closure.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Original Root UI class closure regressions failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_original_root_ui_candidate_classpath.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Actual candidate classpath binding regressions failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_original_root_ui_runtime_binding.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Production classes, resources and native projection binding regressions failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_same_workspace_candidate.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Same-workspace main output congruence regression failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_original_root_ui_runtime_image.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Actual packaged runtime image and pinned JDK launcher binding regressions failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_original_root_ui_packaged_native.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Fixed native binaries, source notices and packaged provenance binding regressions failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_candidate_production_classpath.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Actual Gradle host classpath correction regressions failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_package_checkout_consistency.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Source and package checkout byte consistency regressions failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_prepare_js_worker.py -v
          if ($LASTEXITCODE -ne 0) { throw 'JS worker provenance and binary identity regressions failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_export_original_root_ui_harness.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Original Root UI export admission regressions failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_verify_original_root_ui_export.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Original Root UI export readback regressions failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_windows_video_return_frozen_inputs.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Whole original return renderer frozen-input regressions failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_comment_selection_consumer_closure.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Complete original comment selection consumer regressions failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_v029_comment_composer.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Complete original comment composer and inverse regressions failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_v041_video_status_labels_source.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Original v041 status-label regressions failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_v043_home_recommendation_badges_source.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Original recommendation badge and author row source contracts failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_v043_home_native_cards_source.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Original Home native-card model, route and recommendation protocol contracts failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_v043_search_up_author_source.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Original v043 UP-search author source validation failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_v043_navigation_source.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Original v043 navigation source validation failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_v043_message_link_host_source.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Original message H5 host guard source validation failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_v043_link_open_source.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Original v043 link-open source validation failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_refresh_generation_reentry.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Repeated original Home generation changed or rejected its own qualified outputs.' }
          python -m unittest discover -s desktop/tools/tests -p test_v041_video_status_personal_consumers.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Original v041 personal video status source regressions failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_profile_agreement_owner_source.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Complete original profile agreement ownership regressions failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_v041_search_all_source.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Complete original comprehensive-search source and ownership regressions failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_fixed_java_toolchain.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Actual fixed Java toolchain and build evidence regressions failed.' }
      - name: Stage the existing pinned JDK
        shell: pwsh
        run: |
          $jdkArchive = Join-Path $env:RUNNER_TEMP 'bilipai-fixed-jdk.zip'
          $jdkHome = Join-Path $env:RUNNER_TEMP 'bilipai-fixed-jdk'
          python desktop/tools/fetch-js-worker-jdk.py --archive "$jdkArchive" --output "$jdkHome"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned JDK verification failed.' }
          "JAVA_HOME=$jdkHome" | Add-Content -LiteralPath $env:GITHUB_ENV
      - name: Stage the reviewed Windows SDK
        shell: pwsh
        run: |
          $sdkRoot = Join-Path $env:RUNNER_TEMP 'bilipai-native-share-sdk'
          $receipt = python desktop/tools/provision-native-diagnostic-sdk.py --repo "$env:GITHUB_WORKSPACE" --temp-root "$env:RUNNER_TEMP" --output "$sdkRoot"
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed SDK provisioning failed.' }
          $sdk = ($receipt -join "`n") | ConvertFrom-Json
          if ($sdk.passed -ne $true -or $sdk.sdkInputsExact -ne $true -or [IO.Path]::GetFullPath($sdk.sdkRoot) -ne [IO.Path]::GetFullPath($sdkRoot)) { throw 'SDK provisioning did not produce the exact isolated root.' }
          "BILIPAI_NATIVE_SHARE_SDK_ROOT=$sdkRoot" | Add-Content -LiteralPath $env:GITHUB_ENV
      - name: Stage the reviewed MSVC tools
        shell: pwsh
        run: |
          $vcRoot = Join-Path $env:RUNNER_TEMP 'bilipai-native-share-vc'
          $receipt = python desktop/tools/provision-native-diagnostic-msvc.py --repo "$env:GITHUB_WORKSPACE" --temp-root "$env:RUNNER_TEMP" --output "$vcRoot"
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed VC provisioning failed.' }
          $vc = ($receipt -join "`n") | ConvertFrom-Json
          if ($vc.passed -ne $true -or $vc.vcInputsExact -ne $true -or $vc.compilerBinSetExact -ne $true -or $vc.englishResourcesExact -ne $true -or [IO.Path]::GetFullPath($vc.vcRoot) -ne [IO.Path]::GetFullPath($vcRoot)) { throw 'VC provisioning did not produce the exact isolated root.' }
          "BILIPAI_NATIVE_SHARE_VC_ROOT=$vcRoot" | Add-Content -LiteralPath $env:GITHUB_ENV
      - name: Compile and validate the exact source cohort
        id: source
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BILIPAI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONIOENCODING: utf-8
        run: |
          python desktop/tools/validate-source-cohort.py --run --repo "$env:GITHUB_WORKSPACE" --output "$env:RUNNER_TEMP/bilipai-source-validation" | Tee-Object -FilePath "$env:RUNNER_TEMP/bilipai-source-step.log"
          if ($LASTEXITCODE -ne 0) { throw 'Source cohort validation failed; see the exact receipt and test XML in this log.' }
      - name: Validate NVIDIA source pins and actual verifier resource after Gradle
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONIOENCODING: utf-8
        run: |
          python -m unittest discover -s desktop/tools/tests -p test_rtx_hdr_color.py -v
          if ($LASTEXITCODE -ne 0) { throw 'NVIDIA complete source pin and generated verifier resource regression failed.' }
      - name: Export qualified updater fixture without running an EXE
        if: steps.source.outputs.updater_harness_exported == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-updater-harness-${{ github.sha }}
          path: ${{ runner.temp }}/bilipai-source-validation/updater-harness
          if-no-files-found: error
          retention-days: 1
      - name: Export qualified original Root UI fixture without running an EXE
        if: steps.source.outputs.original_root_ui_harness_exported == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-original-root-ui-harness-${{ github.sha }}
          path: ${{ runner.temp }}/bilipai-source-validation/original-root-ui-harness
          if-no-files-found: error
          retention-days: 1
      - name: Prepare one provisional candidate from the same tested workspace
        id: same_workspace_candidate
        if: startsWith(github.ref_name, 'desktop/source-validation-package-') && steps.source.outputs.original_root_ui_harness_exported == 'true'
        shell: pwsh
        env:
          BILIPAI_WINDOWS_RELEASE_REPOSITORY: tonysuper666-creator/BiliPai-Windows
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONIOENCODING: utf-8
        run: |
          $env:GRADLE_OPTS = '-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=1 -Dorg.gradle.parallel=false -Dkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs="-Xmx8g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m"'
          & ./desktop/tools/build.ps1 -SkipTests -FixedJavaToolchain -JavaHome $env:JAVA_HOME -GradleUserHomePath "$env:RUNNER_TEMP/bilipai-source-validation/gradle-home" | Tee-Object -FilePath "$env:RUNNER_TEMP/bilipai-candidate-step.log"
          if ($LASTEXITCODE -ne 0) { throw 'Provisional same-workspace candidate preparation failed.' }
          python desktop/tools/verify-same-workspace-candidate.py --repo "$env:GITHUB_WORKSPACE" --candidate 'desktop/build/compose/binaries/main/app/BiliPai Windows' --ui-export "$env:RUNNER_TEMP/bilipai-source-validation/original-root-ui-harness" --source-log "$env:RUNNER_TEMP/bilipai-source-step.log" --package-log "$env:RUNNER_TEMP/bilipai-candidate-step.log" --source-sha '${{ github.sha }}' --output 'desktop/build/distributions/same-workspace-candidate.json'
          if ($LASTEXITCODE -ne 0) { throw 'Packaged main differs from the preceding actual tested output.' }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Candidate preparation changed committed source.' }
      - name: Export provisional same-workspace image for terminal-run admission
        if: steps.same_workspace_candidate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: BiliPai-Windows-same-workspace-candidate-x64
          path: |
            desktop/build/distributions/*.zip
            desktop/build/distributions/*.zip.sha256
            desktop/build/distributions/same-workspace-candidate.json
            desktop/build/distributions/candidate-toolchain.json
            desktop/build/distributions/candidate-runtime-model.json
            desktop/build/distributions/candidate-classpath.json
          if-no-files-found: error
          retention-days: 1
