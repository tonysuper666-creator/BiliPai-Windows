name: Windows source validation
run-name: "Windows source validation | ${{ github.sha }}"

on:
  push:
    branches: ['desktop/source-validation-*']

permissions:
  contents: read

concurrency:
  group: windows-source-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-validation:
    if: github.repository == 'tonysuper666-creator/BiliPai-Windows' && github.event.repository.private == false
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Set checkout path and newline policy
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Windows subprocesses, runtime staging and original collection seams
        shell: pwsh
        run: |
          python -c "import shutil; assert shutil.which('pwsh') and shutil.which('powershell.exe'), 'Both real PowerShell hosts are required'"
          if ($LASTEXITCODE -ne 0) { throw 'Verifier subprocess preflight failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_veyra_verifier_child_environment.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Actual verifier subprocess regression failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_mpv_companion_resource_staging.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Verified MPV companion packaging regression failed.' }
          python -m unittest discover -s desktop/tools/tests -p test_v038_listen_collection_source.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Original collection source adaptation regression failed.' }
      - name: Stage the existing pinned JDK
        shell: pwsh
        run: |
          $jdkArchive = Join-Path $env:RUNNER_TEMP 'bilipai-fixed-jdk.zip'
          $jdkHome = Join-Path $env:RUNNER_TEMP 'bilipai-fixed-jdk'
          python desktop/tools/fetch-js-worker-jdk.py --archive "$jdkArchive" --output "$jdkHome"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned JDK verification failed.' }
          "JAVA_HOME=$jdkHome" | Add-Content -LiteralPath $env:GITHUB_ENV
      - name: Stage the reviewed Windows SDK
        shell: pwsh
        run: |
          $sdkRoot = Join-Path $env:RUNNER_TEMP 'bilipai-native-share-sdk'
          $receipt = python desktop/tools/provision-native-diagnostic-sdk.py --repo "$env:GITHUB_WORKSPACE" --temp-root "$env:RUNNER_TEMP" --output "$sdkRoot"
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed SDK provisioning failed.' }
          $sdk = ($receipt -join "`n") | ConvertFrom-Json
          if ($sdk.passed -ne $true -or $sdk.sdkInputsExact -ne $true -or [IO.Path]::GetFullPath($sdk.sdkRoot) -ne [IO.Path]::GetFullPath($sdkRoot)) { throw 'SDK provisioning did not produce the exact isolated root.' }
          "BILIPAI_NATIVE_SHARE_SDK_ROOT=$sdkRoot" | Add-Content -LiteralPath $env:GITHUB_ENV
      - name: Stage the reviewed MSVC tools
        shell: pwsh
        run: |
          $vcRoot = Join-Path $env:RUNNER_TEMP 'bilipai-native-share-vc'
          $receipt = python desktop/tools/provision-native-diagnostic-msvc.py --repo "$env:GITHUB_WORKSPACE" --temp-root "$env:RUNNER_TEMP" --output "$vcRoot"
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed VC provisioning failed.' }
          $vc = ($receipt -join "`n") | ConvertFrom-Json
          if ($vc.passed -ne $true -or $vc.vcInputsExact -ne $true -or $vc.compilerBinSetExact -ne $true -or $vc.englishResourcesExact -ne $true -or [IO.Path]::GetFullPath($vc.vcRoot) -ne [IO.Path]::GetFullPath($vcRoot)) { throw 'VC provisioning did not produce the exact isolated root.' }
          "BILIPAI_NATIVE_SHARE_VC_ROOT=$vcRoot" | Add-Content -LiteralPath $env:GITHUB_ENV
      - name: Compile and validate the exact source cohort
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BILIPAI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONIOENCODING: utf-8
        run: |
          python desktop/tools/validate-source-cohort.py --run --repo "$env:GITHUB_WORKSPACE" --output "$env:RUNNER_TEMP/bilipai-source-validation"
          if ($LASTEXITCODE -ne 0) { throw 'Source cohort validation failed; see the exact receipt and test XML in this log.' }
