name: Windows source validation
run-name: "Windows source validation | ${{ github.sha }}"

on:
  push:
    branches: ['desktop/source-validation-*']

permissions:
  contents: read

concurrency:
  group: windows-source-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-validation:
    if: github.repository == 'tonysuper666-creator/BiliPai-Windows' && github.event.repository.private == false
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Set checkout path and newline policy
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage the existing pinned JDK
        shell: pwsh
        run: |
          $jdkArchive = Join-Path $env:RUNNER_TEMP 'bilipai-fixed-jdk.zip'
          $jdkHome = Join-Path $env:RUNNER_TEMP 'bilipai-fixed-jdk'
          python desktop/tools/fetch-js-worker-jdk.py --archive "$jdkArchive" --output "$jdkHome"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned JDK verification failed.' }
          "JAVA_HOME=$jdkHome" | Add-Content -LiteralPath $env:GITHUB_ENV
      - name: Compile and validate the exact source cohort
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BILIPAI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONIOENCODING: utf-8
        run: |
          python desktop/tools/validate-source-cohort.py --run --repo "$env:GITHUB_WORKSPACE" --output "$env:RUNNER_TEMP/bilipai-source-validation"
          if ($LASTEXITCODE -ne 0) { throw 'Source cohort validation failed; see the exact receipt and test XML in this log.' }
