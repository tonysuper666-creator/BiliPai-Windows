name: Prepare Windows upstream update

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */2 * * *'

# Automatic sync/publication is dormant until explicitly enabled on a personal repo.
permissions:
  contents: read

concurrency:
  group: windows-upstream-update
  cancel-in-progress: false

jobs:
  detect:
    if: >-
      github.repository == 'tonysuper666-creator/BiliPai-Windows' && github.event.repository.private == false &&
      (
      github.repository != 'jay3-yy/BiliPai' &&
      (github.event_name == 'workflow_dispatch' || vars.BILIPAI_WINDOWS_AUTO_SYNC == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # This stage never builds, pushes, opens a PR, dispatches, or publishes.
      contents: read
    outputs:
      update_needed: ${{ steps.check.outputs.update_needed }}
      publication_needed: ${{ steps.check.outputs.publication_needed }}
      source_sha: ${{ steps.check.outputs.source_sha }}
    env:
      BILIPAI_WINDOWS_CHECK_SOURCE_SHA: 47beb8ce531bc46d7eb24c0f48a6c5ff6284e2fd
    steps:
      - name: Validate required fixed own source
        shell: python
        run: |
          import os, re
          source = os.environ['BILIPAI_WINDOWS_CHECK_SOURCE_SHA']
          if os.environ['GITHUB_REPOSITORY'] != 'tonysuper666-creator/BiliPai-Windows':
              raise RuntimeError('Read-only detection requires the reviewed own repository.')
          if not re.fullmatch(r'[0-9a-f]{40}', source) or source == '0' * 40:
              raise RuntimeError('A verified full own source commit must replace the preparation placeholder.')
      - uses: actions/checkout@v4
        with:
          repository: tonysuper666-creator/BiliPai-Windows
          ref: ${{ env.BILIPAI_WINDOWS_CHECK_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify updater and publication safety policies
        shell: python
        run: |
          import os, subprocess
          source = os.environ['BILIPAI_WINDOWS_CHECK_SOURCE_SHA']
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if actual != source:
              raise RuntimeError('Checked source differs from the reviewed immutable own commit.')
          subprocess.run(['git', 'diff', '--exit-code', 'HEAD', '--'], check=True)
          subprocess.run(['python', 'desktop/tools/run-tool-tests.py', '--stage', 'policies'], check=True)
          subprocess.run(['git', 'diff', '--exit-code', 'HEAD', '--'], check=True)
      - name: Check upstream compatibility without building or publishing
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json, os, subprocess
          from pathlib import Path
          source = os.environ['BILIPAI_WINDOWS_CHECK_SOURCE_SHA']
          if subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() != source:
              raise RuntimeError('Read-only check source changed after policies.')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('update_needed=false\npublication_needed=false\n')
              output.write('source_sha=' + source + '\n')
          result = subprocess.run(['python', 'desktop/tools/sync-upstream.py', '--check'],
                                  capture_output=True, text=True, encoding='utf-8')
          receipt = {'mode': 'readOnlyDetection', 'checkedOwnSourceSha': source,
                     'candidateBuildEnabled': False, 'publicationEnabled': False,
                     'checkExitCode': result.returncode}
          failed = result.returncode != 0
          if not failed:
              try:
                  receipt['upstream'] = json.loads(result.stdout)
              except (ValueError, TypeError) as error:
                  failed = True
                  receipt['error'] = 'Invalid compatibility report: ' + str(error)
                  receipt['stdout'] = result.stdout[-16000:]
          else:
              receipt['error'] = result.stderr[-16000:]
              receipt['stdout'] = result.stdout[-16000:]
          Path(os.environ['RUNNER_TEMP'], 'upstream-check.json').write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(receipt, ensure_ascii=False, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('### Read-only upstream compatibility check\n\n')
              summary.write('<pre>' + json.dumps(receipt, ensure_ascii=False, indent=2)
                            .replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;') + '</pre>\n')
          subprocess.run(['git', 'diff', '--exit-code', 'HEAD', '--'], check=True)
          if subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() != source:
              raise RuntimeError('Read-only check changed the immutable own source.')
          if failed:
              raise RuntimeError('Read-only upstream check failed; complete error is retained in the check receipt and job log.')

  candidate:
    needs: detect
    if: ${{ github.repository == 'tonysuper666-creator/BiliPai-Windows' && github.event.repository.private == false && false && (needs.detect.outputs.update_needed == 'true') }}
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    outputs:
      source_sha: ${{ steps.advance.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build isolated candidate with all release gates
        id: candidate
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BILIPAI_WINDOWS_RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $result = python desktop/tools/sync-upstream.py --sync --release-gate --worktree-root "$env:RUNNER_TEMP/windows-updates" --java-home "$env:JAVA_HOME"
          if ($LASTEXITCODE -ne 0) { throw 'Candidate failed; no branch or PR is published.' }
          $report = ($result -join "`n") | ConvertFrom-Json
          if ($report.status -ne 'candidateReady' -or $report.buildStatus -ne 'passed' -or $report.releaseGatePassed -ne $true) { throw 'No release-gated candidate was produced.' }
          $result | Set-Content -LiteralPath "$env:RUNNER_TEMP/upstream-candidate.json" -Encoding utf8
          if ($report.autoPublishEligible -eq $true -and '${{ vars.BILIPAI_WINDOWS_AUTO_PUBLISH }}' -eq 'true') {
            'autopublish=true' | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          }
      - name: Upload tested candidate for review
        uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: BiliPai-Windows-update-candidate
          path: |
            ${{ runner.temp }}/windows-updates/**/desktop/build/distributions/*.zip
            ${{ runner.temp }}/windows-updates/**/desktop/build/distributions/*.zip.sha256
          if-no-files-found: error
      - name: Advance personal Windows branch to validated low-risk sources
        id: advance
        if: steps.candidate.outputs.autopublish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $report = Get-Content -LiteralPath "$env:RUNNER_TEMP/upstream-candidate.json" -Raw | ConvertFrom-Json
          python desktop/tools/sync-upstream.py --publication-check
          if ($LASTEXITCODE -ne 0 -or $report.releaseGatePassed -ne $true -or $report.autoPublishEligible -ne $true) { throw 'Automatic publication rejected this candidate.' }
          $actualHead = git -C $report.candidatePath rev-parse HEAD
          if ($actualHead -ne $report.candidateHead) { throw 'Candidate source changed after its successful build.' }
          $baseBranch = gh repo view $env:GITHUB_REPOSITORY --json defaultBranchRef --jq '.defaultBranchRef.name'
          if ($LASTEXITCODE -ne 0 -or -not $baseBranch) { throw 'Could not resolve the Windows default branch.' }
          gh auth setup-git
          if ($LASTEXITCODE -ne 0) { throw 'Could not configure personal repository authentication.' }
          git -C $report.candidatePath push origin "$($report.candidateBranch):refs/heads/$baseBranch"
          if ($LASTEXITCODE -ne 0) { throw 'Fast-forward failed; concurrent source changes require review. No force push is used.' }
          "source_sha=$($report.candidateHead)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
      - name: Open draft source update PR for manual review
        if: steps.candidate.outputs.autopublish != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $report = Get-Content -LiteralPath "$env:RUNNER_TEMP/upstream-candidate.json" -Raw | ConvertFrom-Json
          python desktop/tools/sync-upstream.py --publication-check
          if ($LASTEXITCODE -ne 0) { throw 'Publication safety check failed.' }
          $candidatePath = [IO.Path]::GetFullPath($report.candidatePath)
          $allowedRoot = [IO.Path]::GetFullPath("$env:RUNNER_TEMP/windows-updates") + [IO.Path]::DirectorySeparatorChar
          if (-not $candidatePath.StartsWith($allowedRoot, [StringComparison]::OrdinalIgnoreCase)) { throw 'Candidate escaped its worktree directory.' }
          $actualHead = git -C $candidatePath rev-parse HEAD
          if ($actualHead -ne $report.candidateHead -or $report.buildStatus -ne 'passed') { throw 'Candidate changed after its successful build.' }
          $body = @"
          Updates Windows sources to $($report.candidateTag) at $($report.candidateCommit).

          Windows unit tests, updater safety tests, guest backend smoke, and packaged native player checks passed. The candidate ZIP is attached to this workflow run.

          Reused source changes: $(@($report.changedReusedSources) -join ', ')
          Features needing review: $(@($report.featuresNeedingReview) -join ', ')
          Manual review reasons: $(@($report.manualReviewReasons) -join '; ')
          Unported upstream paths changed: $(@($report.unportedChangedPaths).Count).

          Coverage inventory:
          $($report.featureCoverage | ConvertTo-Json -Depth 4)

          Android changes do not expand Windows coverage automatically. Review login and mouse/keyboard behavior before merging.

          Upstream release: $($report.releaseUrl)
          "@
          $bodyFile = "$env:RUNNER_TEMP/windows-update-pr.md"
          $body | Set-Content -LiteralPath $bodyFile -Encoding utf8
          gh auth setup-git
          if ($LASTEXITCODE -ne 0) { throw 'Could not configure personal repository authentication.' }
          git -C $candidatePath push origin $report.candidateBranch
          if ($LASTEXITCODE -ne 0) { throw 'Candidate push failed.' }
          $baseBranch = gh repo view $env:GITHUB_REPOSITORY --json defaultBranchRef --jq '.defaultBranchRef.name'
          if ($LASTEXITCODE -ne 0 -or -not $baseBranch) { throw 'Could not resolve the Windows default branch.' }
          gh pr create --repo $env:GITHUB_REPOSITORY --base $baseBranch --head $report.candidateBranch --draft --title "Windows sources: $($report.candidateTag)" --body-file $bodyFile
          if ($LASTEXITCODE -ne 0) { throw 'PR creation failed; the tested branch remains available for review.' }

  recover_publication:
    needs: [detect, candidate]
    if: >-
      github.repository == 'tonysuper666-creator/BiliPai-Windows' && github.event.repository.private == false && false &&
      (
      always() && needs.detect.result == 'success' &&
      (needs.candidate.result == 'success' || needs.candidate.result == 'skipped') &&
      vars.BILIPAI_WINDOWS_AUTO_PUBLISH == 'true' &&
      (needs.detect.outputs.publication_needed == 'true' || needs.candidate.outputs.source_sha != '')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.source_sha || needs.detect.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retry incomplete Windows publication from its fixed source commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json, os, subprocess
          def command(*args):
              return subprocess.run(args, check=True, capture_output=True, text=True).stdout
          repository = os.environ['GITHUB_REPOSITORY']
          report = json.loads(command('python', 'desktop/tools/publish-release.py', '--check', '--repository', repository))
          if report['publicationNeeded']:
              base = command('gh', 'repo', 'view', repository, '--json', 'defaultBranchRef', '--jq', '.defaultBranchRef.name').strip()
              if not base:
                  raise RuntimeError('No Windows default branch was found.')
              command('gh', 'workflow', 'run', 'windows-desktop.yml', '--repo', repository, '--ref', base,
                      '-f', 'release=true', '-f', 'source_sha=' + report['sourceSha'], '-f', 'expected_head=' + report['sourceSha'])
              print('Requested complete Windows release ' + report['tag'] + ' from fixed source ' + report['sourceSha'])
          else:
              print('Windows release and immutable source assets are complete.')
