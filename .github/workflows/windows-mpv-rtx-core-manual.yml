name: Manual RTX core frame-bridge libmpv Windows x64 source build

on:
  workflow_dispatch:
    inputs:
      producer_variant:
        description: 'Exact reviewed source variant; presentation remains unverified until runtime validation'
        required: true
        type: choice
        default: bilipai-veyra-rtx-present-v1
        options:
          - bilipai-veyra-rtx-core-v1
          - bilipai-veyra-rtx-present-v1
      acknowledge_source_build:
        description: 'Build an unverified RTX frame-bridge candidate; no GPU/SDK runtime is run'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native-candidate:
    if: >-
      github.repository == 'tonysuper666-creator/BiliPai-Windows' && github.event.repository.private == false
      && github.event_name == 'workflow_dispatch' && inputs.acknowledge_source_build == true
      && github.ref_type == 'tag'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BILIPAI_RTX_VARIANT: ${{ inputs.producer_variant }}
    container:
      # Public linux/amd64 OCI manifest retrieved 2026-10-08; deliberately newer build environment.
      # Replaces the unavailable historical digest; native sources/recipes/actions remain fixed.
      image: ghcr.io/shinchiro/archlinux@sha256:2b81f07c567b051455b9539770a71b53dd3add5f9ef52eca95ac01a2272e9fdf
    steps:
      # These exact action revisions are recorded in the same original build log.
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - name: Build from fixed source and recipe inputs
        run: python3 desktop/tools/native/build-mpv-rtx-core-runtime.py --variant "$BILIPAI_RTX_VARIANT" --workspace "$RUNNER_TEMP/bilipai-mpv-rtx-core" --output "$GITHUB_WORKSPACE/desktop/build/rtx-core-native-candidate"
      # Root must create the immutable rtx-source-* tag before this manual dispatch.
      # Only successful source builds may save a draft; failure output stays in job logs.
      - name: Save successful source candidate in an unpublished own-repository draft
        if: success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 desktop/tools/native/upload-mpv-rtx-core-draft.py --variant "$BILIPAI_RTX_VARIANT" --output "$GITHUB_WORKSPACE/desktop/build/rtx-core-native-candidate"
