name: Manual RTX core frame-bridge libmpv Windows x64 source build

on:
  workflow_dispatch:
    inputs:
      producer_variant:
        description: 'Exact reviewed source variant; presentation remains unverified until runtime validation'
        required: true
        type: choice
        default: bilipai-veyra-rtx-present-v1
        options:
          - bilipai-veyra-rtx-core-v1
          - bilipai-veyra-rtx-present-v1
          - retain-builder-only
      trusted_host_llvm_record_id:
        description: 'Optional exact independently reviewed own HOST LLVM record ID; an explicit failed request never falls back to cold build'
        required: false
        type: string
        default: ''
      acknowledge_source_build:
        description: 'Build an unverified RTX frame-bridge candidate; no GPU/SDK runtime is run'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  retain-builder:
    if: >-
      github.repository == 'tonysuper666-creator/BiliPai-Windows' && github.event.repository.private == false
      && github.event_name == 'workflow_dispatch' && inputs.acknowledge_source_build == true
      && github.ref_type == 'tag' && inputs.producer_variant == 'retain-builder-only'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: bilipai-builder-c7dffe77b57d98b10e327dde12d3977faf4cb90aa7cb4f5eeac4e9d68d724239
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - name: Reject HOST reuse for builder-retention-only operation
        if: inputs.trusted_host_llvm_record_id != ''
        run: |
          echo 'HOST reuse requires a native source build variant.' >&2
          exit 1
      - name: Install registry transfer utility on the standard host
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y skopeo
      - name: Retain exact reviewed builder image in own registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 desktop/tools/native/retain-builder-image.py

  native-candidate:
    if: >-
      github.repository == 'tonysuper666-creator/BiliPai-Windows' && github.event.repository.private == false
      && github.event_name == 'workflow_dispatch' && inputs.acknowledge_source_build == true
      && github.ref_type == 'tag'
      && inputs.producer_variant != 'retain-builder-only'
    permissions:
      contents: write
      packages: read
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BILIPAI_RTX_VARIANT: ${{ inputs.producer_variant }}
      BILIPAI_HOST_LLVM_RECORD_ID: ${{ inputs.trusted_host_llvm_record_id }}
    container:
      # Exact linux/amd64 builder retained and authenticated in own workflow run 37928635585.
      # This is a new OCI environment; old HOST snapshot evidence cannot be relabelled or reused.
      image: ghcr.io/tonysuper666-creator/bilipai-windows-builder@sha256:c7dffe77b57d98b10e327dde12d3977faf4cb90aa7cb4f5eeac4e9d68d724239
      options: --env ImageOS --env ImageVersion
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # These exact action revisions are recorded in the same original build log.
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - name: Download exact independently reviewed own HOST snapshot
        if: inputs.trusted_host_llvm_record_id != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 desktop/tools/native/download-host-llvm-source-snapshot.py --record-id "$BILIPAI_HOST_LLVM_RECORD_ID" --output "$RUNNER_TEMP/bilipai-host-llvm-input"
      - name: Build from fixed source and recipe inputs
        id: native_build
        run: |
          unset GITHUB_TOKEN GH_TOKEN
          if [ -n "$BILIPAI_HOST_LLVM_RECORD_ID" ]; then
            python3 desktop/tools/native/build-mpv-rtx-core-runtime.py --variant "$BILIPAI_RTX_VARIANT" --workspace "$RUNNER_TEMP/bilipai-mpv-rtx-core" --output "$GITHUB_WORKSPACE/desktop/build/rtx-core-native-candidate" --host-llvm-snapshot-dir "$RUNNER_TEMP/bilipai-host-llvm-input"
          else
            python3 desktop/tools/native/build-mpv-rtx-core-runtime.py --variant "$BILIPAI_RTX_VARIANT" --workspace "$RUNNER_TEMP/bilipai-mpv-rtx-core" --output "$GITHUB_WORKSPACE/desktop/build/rtx-core-native-candidate"
          fi
      # Root must create the immutable rtx-source-* tag before this manual dispatch.
      # Native candidates still require full success. Qualified HOST material may survive a downstream failure.
      - name: Save successful source candidate in an unpublished own-repository draft
        if: success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 desktop/tools/native/upload-mpv-rtx-core-draft.py --variant "$BILIPAI_RTX_VARIANT" --output "$GITHUB_WORKSPACE/desktop/build/rtx-core-native-candidate"
      - name: Save qualified HOST LLVM snapshot after a failed native build
        if: failure() && steps.native_build.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 desktop/tools/native/upload-mpv-rtx-core-draft.py --host-snapshot-only --variant "$BILIPAI_RTX_VARIANT" --output "$GITHUB_WORKSPACE/desktop/build/rtx-core-native-candidate"
