name: Windows desktop build

on:
  workflow_dispatch:
    inputs:
      installer:
        description: Also build an MSI installer (requires WiX)
        type: boolean
        default: false
      release:
        description: Publish after unit, guest network, and packaged native player checks
        type: boolean
        default: false
      expected_head:
        description: Optional exact source commit required by publication
        type: string
        default: ''
      source_sha:
        description: Fixed source commit to build, including publication recovery
        type: string
        default: ''
      render_diagnostic:
        description: Run only the isolated AWT and mpv rendering experiment; never build or publish the app
        type: boolean
        default: false
      diagnostic_suite:
        description: Isolated rendering experiment selected only when render_diagnostic is enabled
        type: choice
        options: [surface, shader-clear]
        default: surface
  push:
    branches: ['desktop/windows']
    paths:
      - 'desktop/**'
      - '.github/workflows/windows-desktop.yml'
      - 'app/**'
      - 'settings-core/**'
      - 'gradle/wrapper/**'
      - 'gradlew.bat'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/windows-desktop.yml'
      - 'gradle/wrapper/**'
      - 'gradlew.bat'

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ inputs.source_sha || github.sha }}
  cancel-in-progress: false

jobs:
  render-diagnostic:
    if: >-
      github.repository == 'tonysuper666-creator/BiliPai-Windows' && github.event.repository.private == false
      && (github.repository != 'jay3-yy/BiliPai' && github.event_name == 'workflow_dispatch' && inputs.render_diagnostic == true)
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Enable Git long paths
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Verify diagnostic source
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          $head = git rev-parse HEAD
          foreach ($required in @($env:SOURCE_SHA, $env:EXPECTED_HEAD)) {
            if ($required -and ($required -notmatch '^[0-9a-f]{40}$' -or $head -ne $required)) { throw 'Diagnostic checkout differs from the fixed commit.' }
          }
          if ('${{ inputs.release }}' -eq 'true') { throw 'Rendering diagnostics cannot publish a release.' }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated physical-screen experiments
        shell: pwsh
        env:
          DIAGNOSTIC_SUITE: ${{ inputs.diagnostic_suite || 'surface' }}
        run: python desktop/tools/diagnostics/run-render-probe.py --suite "$env:DIAGNOSTIC_SUITE" --java-home "$env:JAVA_HOME" --output "$env:RUNNER_TEMP/bilipai-render-probe"
      - name: Upload rendering diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-render-diagnostic
          path: |
            ${{ runner.temp }}/bilipai-render-probe/summary.json
            ${{ runner.temp }}/bilipai-render-probe/*.log
            ${{ runner.temp }}/bilipai-render-probe/awt-alpha-only/*.json
            ${{ runner.temp }}/bilipai-render-probe/awt-alpha-only/*.png
            ${{ runner.temp }}/bilipai-render-probe/awt-alpha-only/*.txt
            ${{ runner.temp }}/bilipai-render-probe/mpv-default-flip/*.json
            ${{ runner.temp }}/bilipai-render-probe/mpv-default-flip/*.png
            ${{ runner.temp }}/bilipai-render-probe/mpv-default-flip/*.txt
            ${{ runner.temp }}/bilipai-render-probe/mpv-bitblt/*.json
            ${{ runner.temp }}/bilipai-render-probe/mpv-bitblt/*.png
            ${{ runner.temp }}/bilipai-render-probe/mpv-bitblt/*.txt
            ${{ runner.temp }}/bilipai-render-probe/mpv-adaptive/*.json
            ${{ runner.temp }}/bilipai-render-probe/mpv-adaptive/*.png
            ${{ runner.temp }}/bilipai-render-probe/mpv-adaptive/*.txt
            ${{ runner.temp }}/bilipai-render-probe/shader-clear-*/*.json
            ${{ runner.temp }}/bilipai-render-probe/shader-clear-*/*.png
            ${{ runner.temp }}/bilipai-render-probe/shader-clear-*/*.txt
            ${{ runner.temp }}/bilipai-render-probe/shader-clear-*/*.log
          if-no-files-found: warn
          retention-days: 1

  windows:
    if: >-
      github.repository == 'tonysuper666-creator/BiliPai-Windows' && github.event.repository.private == false
      && (github.repository != 'jay3-yy/BiliPai' && inputs.render_diagnostic != true)
    runs-on: windows-latest
    timeout-minutes: 35
    outputs:
      release: ${{ steps.plan.outputs.release }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
    steps:
      - name: Enable Git long paths on the Windows runner
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          # Source producers verify original blobs at the pinned upstream ancestor.
          fetch-depth: 0
          persist-credentials: false
      - name: Lock the source commit and decide release policy
        id: plan
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          MAKE_RELEASE: ${{ github.event_name != 'pull_request' && (inputs.release == true || (github.event_name == 'push' && vars.BILIPAI_WINDOWS_AUTO_PUBLISH == 'true')) }}
        run: |
          $head = git rev-parse HEAD
          foreach ($required in @($env:SOURCE_SHA, $env:EXPECTED_HEAD)) {
            if ($required -and ($required -notmatch '^[0-9a-f]{40}$' -or $head -ne $required)) { throw 'Checkout differs from the fixed source commit; publication stopped.' }
          }
          "source_sha=$head" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          if ($env:MAKE_RELEASE -eq 'true') { 'release=true' | Add-Content -LiteralPath $env:GITHUB_OUTPUT }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify updater and publication safety policies
        shell: pwsh
        run: python desktop/tools/run-tool-tests.py --stage policies
      - name: Reject inherited publication workflows and upstream remote
        if: steps.plan.outputs.release == 'true'
        shell: pwsh
        run: |
          python desktop/tools/sync-upstream.py --publication-check
          if ($LASTEXITCODE -ne 0) { throw 'Publication safety check failed.' }
      - name: Stage the reviewed Windows SDK in an isolated temporary directory
        shell: pwsh
        run: |
          $sdkRoot = Join-Path $env:RUNNER_TEMP 'bilipai-native-share-sdk'
          $receipt = python desktop/tools/provision-native-diagnostic-sdk.py --repo "$env:GITHUB_WORKSPACE" --temp-root "$env:RUNNER_TEMP" --output "$sdkRoot"
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed SDK provisioning failed; no native build is allowed.' }
          $sdk = ($receipt -join "`n") | ConvertFrom-Json
          if ($sdk.passed -ne $true -or $sdk.sdkInputsExact -ne $true -or [IO.Path]::GetFullPath($sdk.sdkRoot) -ne [IO.Path]::GetFullPath($sdkRoot)) { throw 'SDK provisioning did not produce the exact isolated root.' }
          "BILIPAI_NATIVE_SHARE_SDK_ROOT=$sdkRoot" | Add-Content -LiteralPath $env:GITHUB_ENV
      - name: Stage the reviewed MSVC tools in an isolated temporary directory
        shell: pwsh
        run: |
          $vcRoot = Join-Path $env:RUNNER_TEMP 'bilipai-native-share-vc'
          $receipt = python desktop/tools/provision-native-diagnostic-msvc.py --repo "$env:GITHUB_WORKSPACE" --temp-root "$env:RUNNER_TEMP" --output "$vcRoot"
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed VC provisioning failed; no native build is allowed.' }
          $vc = ($receipt -join "`n") | ConvertFrom-Json
          if ($vc.passed -ne $true -or $vc.vcInputsExact -ne $true -or $vc.compilerBinSetExact -ne $true -or $vc.englishResourcesExact -ne $true -or [IO.Path]::GetFullPath($vc.vcRoot) -ne [IO.Path]::GetFullPath($vcRoot)) { throw 'VC provisioning did not produce the exact isolated root.' }
          "BILIPAI_NATIVE_SHARE_VC_ROOT=$vcRoot" | Add-Content -LiteralPath $env:GITHUB_ENV
      - name: Build tested portable Windows package
        shell: pwsh
        env:
          BILIPAI_WINDOWS_RELEASE_REPOSITORY: ${{ github.repository }}
          MAKE_RELEASE: ${{ steps.plan.outputs.release }}
        run: |
          $parameters = @{ NativeSmoke = $true; UpdaterSmoke = $true }
          if ('${{ inputs.installer }}' -eq 'true') { $parameters.Installer = $true }
          if ($env:MAKE_RELEASE -eq 'true') { $parameters.ReleaseGate = $true }
          try { & ./desktop/tools/build.ps1 @parameters }
          catch {
            # Workflow process facts, not proof of the native JVM's desktop or visible video.
            try {
              $process = [Diagnostics.Process]::GetCurrentProcess()
              try {
                $context = [ordered]@{
                  owner = 'workflow-pwsh'
                  processId = $process.Id
                  sessionId = $process.SessionId
                  userInteractive = [Environment]::UserInteractive
                  sessionName = if ($env:SESSIONNAME) { $env:SESSIONNAME.Substring(0, [Math]::Min(128, $env:SESSIONNAME.Length)) } else { $null }
                }
                Write-Host ('Native build failure runner context: ' + ($context | ConvertTo-Json -Compress))
              } finally { $process.Dispose() }
            } catch { Write-Host 'Native build failure runner context unavailable.' }
            throw
          }
      - name: Upload unit test JUnit XML
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: Windows-unit-test-junit-xml
          path: desktop/build/test-results/test/TEST-*.xml
          if-no-files-found: warn
          retention-days: 1
      - name: Upload packaged native player evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-native-player-smoke-evidence
          path: |
            desktop/build/reports/*/native-player-smoke.*
            desktop/build/reports/*/native-player-smoke*.png
            desktop/build/reports/*/native-player-smoke*.json
            desktop/build/reports/*/native-overlay-before.png
            desktop/build/reports/*/native-overlay-failed.png
            desktop/build/reports/*/native-overlay-failed-state.txt
            desktop/build/reports/*/native-danmaku-overlay.png
            desktop/build/reports/*/native-danmaku-plugin-style.png
            desktop/build/reports/*/native-bas-overlay.png
            desktop/build/reports/*/native-bas-proof.json
            desktop/build/reports/*/native-anime4k-*.png
            desktop/build/reports/*/native-anime4k-failed-state.txt
            desktop/build/reports/*/native-eye-protection.png
            desktop/build/reports/*/native-feedback-carrier.json
            desktop/build/reports/*/native-feedback-carrier-*.png
          if-no-files-found: warn
          retention-days: 1
      - name: Upload packaged updater evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-updater-smoke-evidence
          path: |
            desktop/build/reports/updater-smoke-*/updater-smoke.json
            desktop/build/reports/updater-smoke-*/**/*.log
          if-no-files-found: warn
          retention-days: 1
      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: BiliPai-Windows-x64
          path: |
            desktop/build/distributions/*.zip
            desktop/build/distributions/*.zip.sha256
          if-no-files-found: error
          retention-days: 1
      - name: Upload release smoke evidence
        if: steps.plan.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Windows-release-smoke-evidence
          path: |
            desktop/build/release-gate.json
            desktop/build/reports/release-gate-*/native-player-smoke.*
            desktop/build/reports/release-gate-*/native-player-smoke*.png
            desktop/build/reports/release-gate-*/native-player-smoke*.json
            desktop/build/reports/updater-smoke-*/updater-smoke.json
          if-no-files-found: error
          retention-days: 1
      - name: Upload optional installer
        if: inputs.installer == true
        uses: actions/upload-artifact@v4
        with:
          name: BiliPai-Windows-MSI
          path: desktop/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: windows
    if: >-
      github.repository == 'tonysuper666-creator/BiliPai-Windows' && github.event.repository.private == false
      && (needs.windows.outputs.release == 'true')
    runs-on: ubuntu-latest
    concurrency:
      group: windows-release-publication
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.windows.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: BiliPai-Windows-x64
          path: ${{ runner.temp }}/release-assets
      - uses: actions/download-artifact@v4
        with:
          name: Windows-release-smoke-evidence
          path: ${{ runner.temp }}/release-evidence
      - name: Finish draft, verify immutable tag and all assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.windows.outputs.source_sha }}
        run: >-
          python desktop/tools/publish-release.py --publish
          --repository "$GITHUB_REPOSITORY" --source-sha "$SOURCE_SHA"
          --assets "$RUNNER_TEMP/release-assets" --gate "$RUNNER_TEMP/release-evidence/release-gate.json"
