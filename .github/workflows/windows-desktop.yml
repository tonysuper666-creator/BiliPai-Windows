name: Windows desktop build
run-name: "Windows desktop | ${{ inputs.source_sha || github.sha }} | ${{ inputs.comment_search_ui == true && format('ui-{0}', inputs.comment_ui_case || 'search') || inputs.render_diagnostic == true && format('render-{0}', inputs.diagnostic_suite || 'surface') || 'build' }}"

on:
  workflow_dispatch:
    inputs:
      installer:
        description: Also build an MSI installer (requires WiX)
        type: boolean
        default: false
      release:
        description: Publish after unit, guest network, and packaged native player checks
        type: boolean
        default: false
      expected_head:
        description: Optional exact source commit required by publication
        type: string
        default: ''
      source_sha:
        description: Fixed source commit to build, including publication recovery
        type: string
        default: ''
      render_diagnostic:
        description: Run only the isolated AWT and mpv rendering experiment; never build or publish the app
        type: boolean
        default: false
      comment_search_ui:
        description: Independently exercise original Main comment search with isolated guest read replay; never package or publish
        type: boolean
        default: false
      comment_ui_case:
        description: Isolated actual Main case; composer, feedback and video_share use private synthetic responses and never publish remotely
        type: choice
        options: [search, composer, feedback, video_share, fullscreen]
        default: search
      verify_previous_update:
        description: Also test forwarding from the exact previously delivered Windows EXE in the isolated updater fixture
        type: boolean
        default: false
      diagnostic_suite:
        description: Isolated rendering experiment selected only when render_diagnostic is enabled
        type: choice
        options: [surface, shader-clear, surface-debug, surface-load-order]
        default: surface
  push:
    branches: ['desktop/windows']
    paths:
      - 'desktop/**'
      - '.github/workflows/windows-desktop.yml'
      - 'app/**'
      - 'settings-core/**'
      - 'gradle/wrapper/**'
      - 'gradlew.bat'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/windows-desktop.yml'
      - 'gradle/wrapper/**'
      - 'gradlew.bat'

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ inputs.source_sha || github.sha }}-${{ inputs.comment_search_ui == true && format('ui-{0}', inputs.comment_ui_case || 'search') || inputs.render_diagnostic == true && format('render-{0}', inputs.diagnostic_suite || 'surface') || 'build' }}
  cancel-in-progress: false

jobs:
  render-diagnostic:
    if: >-
      github.repository == 'tonysuper666-creator/BiliPai-Windows' && github.event.repository.private == false
      && (github.repository != 'jay3-yy/BiliPai' && github.event_name == 'workflow_dispatch' && inputs.render_diagnostic == true && inputs.comment_search_ui != true)
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Enable Git long paths
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Verify diagnostic source
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          $head = git rev-parse HEAD
          foreach ($required in @($env:SOURCE_SHA, $env:EXPECTED_HEAD)) {
            if ($required -and ($required -notmatch '^[0-9a-f]{40}$' -or $head -ne $required)) { throw 'Diagnostic checkout differs from the fixed commit.' }
          }
          if ('${{ inputs.release }}' -eq 'true') { throw 'Rendering diagnostics cannot publish a release.' }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated physical-screen experiments
        shell: pwsh
        env:
          DIAGNOSTIC_SUITE: ${{ inputs.diagnostic_suite || 'surface' }}
        run: python desktop/tools/diagnostics/run-render-probe.py --suite "$env:DIAGNOSTIC_SUITE" --java-home "$env:JAVA_HOME" --output "$env:RUNNER_TEMP/bilipai-render-probe"
      - name: Upload rendering diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-render-diagnostic
          path: |
            ${{ runner.temp }}/bilipai-render-probe/summary.json
            ${{ runner.temp }}/bilipai-render-probe/*.log
            ${{ runner.temp }}/bilipai-render-probe/awt-alpha-only/*.json
            ${{ runner.temp }}/bilipai-render-probe/awt-alpha-only/*.png
            ${{ runner.temp }}/bilipai-render-probe/awt-alpha-only/*.txt
            ${{ runner.temp }}/bilipai-render-probe/mpv-default-flip/*.json
            ${{ runner.temp }}/bilipai-render-probe/mpv-default-flip/*.png
            ${{ runner.temp }}/bilipai-render-probe/mpv-default-flip/*.txt
            ${{ runner.temp }}/bilipai-render-probe/mpv-default-debug/*.json
            ${{ runner.temp }}/bilipai-render-probe/mpv-default-debug/*.png
            ${{ runner.temp }}/bilipai-render-probe/mpv-default-debug/*.txt
            ${{ runner.temp }}/bilipai-render-probe/mpv-default-flip-panscan1/*.json
            ${{ runner.temp }}/bilipai-render-probe/mpv-default-flip-panscan1/*.png
            ${{ runner.temp }}/bilipai-render-probe/mpv-default-flip-panscan1/*.txt
            ${{ runner.temp }}/bilipai-render-probe/mpv-default-flip-panscan1-immediate/*.json
            ${{ runner.temp }}/bilipai-render-probe/mpv-default-flip-panscan1-immediate/*.png
            ${{ runner.temp }}/bilipai-render-probe/mpv-default-flip-panscan1-immediate/*.txt
            ${{ runner.temp }}/bilipai-render-probe/mpv-default-flip-panscan1-immediate-dumb/*.json
            ${{ runner.temp }}/bilipai-render-probe/mpv-default-flip-panscan1-immediate-dumb/*.png
            ${{ runner.temp }}/bilipai-render-probe/mpv-default-flip-panscan1-immediate-dumb/*.txt
            ${{ runner.temp }}/bilipai-render-probe/mpv-default-flip-panscan0/*.json
            ${{ runner.temp }}/bilipai-render-probe/mpv-default-flip-panscan0/*.png
            ${{ runner.temp }}/bilipai-render-probe/mpv-default-flip-panscan0/*.txt
            ${{ runner.temp }}/bilipai-render-probe/mpv-default-flip-panscan1-clear/*.json
            ${{ runner.temp }}/bilipai-render-probe/mpv-default-flip-panscan1-clear/*.png
            ${{ runner.temp }}/bilipai-render-probe/mpv-default-flip-panscan1-clear/*.txt
            ${{ runner.temp }}/bilipai-render-probe/mpv-default-flip-zoom-equivalent/*.json
            ${{ runner.temp }}/bilipai-render-probe/mpv-default-flip-zoom-equivalent/*.png
            ${{ runner.temp }}/bilipai-render-probe/mpv-default-flip-zoom-equivalent/*.txt
            ${{ runner.temp }}/bilipai-render-probe/mpv-bitblt/*.json
            ${{ runner.temp }}/bilipai-render-probe/mpv-bitblt/*.png
            ${{ runner.temp }}/bilipai-render-probe/mpv-bitblt/*.txt
            ${{ runner.temp }}/bilipai-render-probe/mpv-adaptive/*.json
            ${{ runner.temp }}/bilipai-render-probe/mpv-adaptive/*.png
            ${{ runner.temp }}/bilipai-render-probe/mpv-adaptive/*.txt
            ${{ runner.temp }}/bilipai-render-probe/shader-clear-*/*.json
            ${{ runner.temp }}/bilipai-render-probe/shader-clear-*/*.png
            ${{ runner.temp }}/bilipai-render-probe/shader-clear-*/*.txt
            ${{ runner.temp }}/bilipai-render-probe/shader-clear-*/*.log
          if-no-files-found: warn
          retention-days: 1

  comment-search-ui:
    if: >-
      github.repository == 'tonysuper666-creator/BiliPai-Windows' && github.event.repository.private == false
      && github.event_name == 'workflow_dispatch' && inputs.comment_search_ui == true
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    env:
      COMMENT_UI_CASE: ${{ inputs.comment_ui_case || 'search' }}
    steps:
      - name: Enable Git long paths
        shell: pwsh
        run: |
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { throw 'Git long-path configuration failed.' }
          $gradleHome = Join-Path $env:RUNNER_TEMP 'bilipai-comment-search-gradle'
          "GRADLE_USER_HOME=$gradleHome" | Add-Content -LiteralPath $env:GITHUB_ENV
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify fixed independent Main acceptance source
        id: source
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          RENDER_DIAGNOSTIC: ${{ inputs.render_diagnostic }}
          MAKE_RELEASE: ${{ inputs.release }}
          MAKE_INSTALLER: ${{ inputs.installer }}
        run: |
          $head = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source HEAD could not be read.' }
          foreach ($required in @($env:SOURCE_SHA, $env:EXPECTED_HEAD)) {
            if ($required -cnotmatch '^[0-9a-f]{40}$' -or $head -cne $required) { throw 'Main acceptance requires the exact source and expected HEAD.' }
          }
          if ($env:RENDER_DIAGNOSTIC -eq 'true' -or $env:MAKE_RELEASE -eq 'true' -or $env:MAKE_INSTALLER -eq 'true') {
            throw 'Independent comment acceptance cannot combine rendering experiments, packaging or publication.'
          }
          $sourceChanges = git status --porcelain --untracked-files=all
          if ($LASTEXITCODE -ne 0) { throw 'Initial source status could not be read.' }
          if ($sourceChanges) {
              Write-Host ($sourceChanges -join "`n")
              throw 'Initial checkout is dirty before runtime preparation.'
          }
          "source_sha=$head" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
      - name: Check the existing free cache limit without changing settings
        id: cache_allowance
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $cacheAllowed = $false
          try {
              $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2026-03-10' }
              $limit = Invoke-RestMethod -Method Get -Uri 'https://api.github.com/repos/tonysuper666-creator/BiliPai-Windows/actions/cache/storage-limit' -Headers $headers -TimeoutSec 20
              $size = $limit.max_cache_size_gb
              $cacheAllowed = ($size -is [int] -or $size -is [long]) -and $size -gt 0 -and $size -le 10
          } catch {
              $exceptionType = $_.Exception.GetType().FullName
              $statusCode = 0
              if ($_.Exception.PSObject.Properties['Response'] -and $_.Exception.Response -and $_.Exception.Response.PSObject.Properties['StatusCode']) {
                  $statusCode = [int]$_.Exception.Response.StatusCode
              }
              Write-Host ("The cache limit could not be verified; preparation will run without persistent caching. Exception={0}; HTTP={1}" -f $exceptionType, $statusCode)
          }
          "allowed=$($cacheAllowed.ToString().ToLowerInvariant())" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          if (-not $cacheAllowed) { Write-Host 'Persistent caching is disabled unless the existing repository limit is at most 10 GB.' }
      - name: Restore only public Gradle dependencies and content-addressed task outputs
        id: gradle_cache
        if: steps.cache_allowance.outputs.allowed == 'true'
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/cache/restore@v4
        with:
          # Do not persist user properties, credentials, daemon state, project build
          # directories, generated source trees, runtime receipts or app sessions.
          path: |
            ${{ env.GRADLE_USER_HOME }}/wrapper/dists
            ${{ env.GRADLE_USER_HOME }}/caches/modules-2
            ${{ env.GRADLE_USER_HOME }}/caches/build-cache-1
          key: bilipai-ui-gradle-v1-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'desktop/gradle.properties', 'desktop/settings.gradle.kts', 'desktop/build.gradle.kts', 'desktop/third-party/miuix5157/build.gradle.kts') }}-${{ steps.source.outputs.source_sha }}
          restore-keys: |
            bilipai-ui-gradle-v1-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'desktop/gradle.properties', 'desktop/settings.gradle.kts', 'desktop/build.gradle.kts', 'desktop/third-party/miuix5157/build.gradle.kts') }}-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select the existing fully verified fixed JDK for this independent mode
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cache = Join-Path $env:GITHUB_WORKSPACE 'desktop/.gradle/js-worker-cache'
          $archive = Join-Path $cache 'fixed-jdk.zip'
          $jdkHome = Join-Path $cache 'fixed-jdk'
          python desktop/tools/fetch-js-worker-jdk.py --archive "$archive" --output "$jdkHome"
          if ($LASTEXITCODE -ne 0) { throw 'Fixed JDK acquisition and complete archive-member verification failed.' }
          $release = Get-Content -LiteralPath (Join-Path $jdkHome 'release') -Raw
          if ($release -cnotmatch '(?m)^JAVA_VERSION="21\.0\.12\.1"\r?$') { throw 'The selected JDK release differs from the existing fixed project package.' }
          "JAVA_HOME=$jdkHome" | Add-Content -LiteralPath $env:GITHUB_ENV
          "BILIPAI_COMMENT_JDK_ARCHIVE=$archive" | Add-Content -LiteralPath $env:GITHUB_ENV
          "PYTHON_EXECUTABLE=$((Get-Command python).Source)" | Add-Content -LiteralPath $env:GITHUB_ENV
      - name: Verify safety policies
        shell: pwsh
        run: python desktop/tools/run-tool-tests.py --stage policies
      - name: Stage the reviewed Windows SDK in an isolated temporary directory
        shell: pwsh
        run: |
          $sdkRoot = Join-Path $env:RUNNER_TEMP 'bilipai-native-share-sdk'
          $receipt = python desktop/tools/provision-native-diagnostic-sdk.py --repo "$env:GITHUB_WORKSPACE" --temp-root "$env:RUNNER_TEMP" --output "$sdkRoot"
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed SDK provisioning failed; no native build is allowed.' }
          $sdk = ($receipt -join "`n") | ConvertFrom-Json
          if ($sdk.passed -ne $true -or $sdk.sdkInputsExact -ne $true -or [IO.Path]::GetFullPath($sdk.sdkRoot) -ne [IO.Path]::GetFullPath($sdkRoot)) { throw 'SDK provisioning did not produce the exact isolated root.' }
          "BILIPAI_NATIVE_SHARE_SDK_ROOT=$sdkRoot" | Add-Content -LiteralPath $env:GITHUB_ENV
      - name: Stage the reviewed MSVC tools in an isolated temporary directory
        shell: pwsh
        run: |
          $vcRoot = Join-Path $env:RUNNER_TEMP 'bilipai-native-share-vc'
          $receipt = python desktop/tools/provision-native-diagnostic-msvc.py --repo "$env:GITHUB_WORKSPACE" --temp-root "$env:RUNNER_TEMP" --output "$vcRoot"
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed VC provisioning failed; no native build is allowed.' }
          $vc = ($receipt -join "`n") | ConvertFrom-Json
          if ($vc.passed -ne $true -or $vc.vcInputsExact -ne $true -or $vc.compilerBinSetExact -ne $true -or $vc.englishResourcesExact -ne $true -or [IO.Path]::GetFullPath($vc.vcRoot) -ne [IO.Path]::GetFullPath($vcRoot)) { throw 'VC provisioning did not produce the exact isolated root.' }
          "BILIPAI_NATIVE_SHARE_VC_ROOT=$vcRoot" | Add-Content -LiteralPath $env:GITHUB_ENV
      - name: Stage the existing pinned native runtimes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./desktop/tools/fetch-mpv.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Pinned mpv acquisition failed; Main must not start.' }
          & ./desktop/tools/fetch-ffmpeg.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Pinned FFmpeg acquisition failed; Main must not start.' }
          $nativeSource = Join-Path $env:GITHUB_WORKSPACE 'desktop/native/windows-x64'
          $nativeResources = Join-Path $env:GITHUB_WORKSPACE 'desktop/resources/common/native/windows-x64'
          New-Item -ItemType Directory -Path $nativeResources -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $nativeSource 'libmpv-2.dll') -Destination $nativeResources -Force
          foreach ($fileName in @('ffmpeg.exe', 'ffprobe.exe', 'ffmpeg-provenance.json')) {
              Copy-Item -LiteralPath (Join-Path $nativeSource $fileName) -Destination $nativeResources -Force
          }
          $licenseSource = Join-Path $nativeSource 'licenses'
          if (Test-Path -LiteralPath $licenseSource) {
              Copy-Item -LiteralPath $licenseSource -Destination $nativeResources -Recurse -Force
          }
          Copy-Item -LiteralPath (Join-Path $nativeSource 'provenance.json') -Destination $nativeResources -Force
      - name: Prepare the original Main test runtime without opening a window
        id: prepare_runtime
        timeout-minutes: 15
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:COMMENT_UI_CASE -cnotin @('search', 'composer', 'feedback', 'video_share', 'fullscreen')) { throw 'Unknown independent comment UI case.' }
          $runtime = Join-Path $env:RUNNER_TEMP 'bilipai-comment-runtime.json'
          $initScript = Join-Path $env:GITHUB_WORKSPACE 'desktop/tools/comment-search-ui.init.gradle'
          & ./gradlew.bat -p desktop --no-daemon --console=plain --max-workers=2 "-Dorg.gradle.jvmargs=-Xmx4g" `
            "-Porg.gradle.java.installations.paths=$env:JAVA_HOME" "-Porg.gradle.java.installations.auto-detect=false" `
            "-Porg.gradle.java.installations.auto-download=false" -I "$initScript" `
            -PcommentSearchPhase=prepare "-PcommentUiCase=$env:COMMENT_UI_CASE" "-PcommentSearchRuntime=$runtime" prepareCommentSearchUiRuntime
          if ($LASTEXITCODE -ne 0) { throw 'Original Main test runtime preparation failed.' }
      - name: Save Gradle preparation before any actual UI or session is created
        if: steps.cache_allowance.outputs.allowed == 'true' && steps.prepare_runtime.outcome == 'success' && steps.gradle_cache.outputs.cache-hit != 'true' && steps.gradle_cache.outputs.cache-primary-key != ''
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.GRADLE_USER_HOME }}/wrapper/dists
            ${{ env.GRADLE_USER_HOME }}/caches/modules-2
            ${{ env.GRADLE_USER_HOME }}/caches/build-cache-1
          key: ${{ steps.gradle_cache.outputs.cache-primary-key }}
      - name: Exercise the selected actual Main comment UI with owned dialogs
        timeout-minutes: 5
        shell: pwsh
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          python desktop/tools/run-comment-search-ui.py --run --repo "$env:GITHUB_WORKSPACE" --java-home "$env:JAVA_HOME" --jdk-archive "$env:BILIPAI_COMMENT_JDK_ARCHIVE" `
            --runtime "$env:RUNNER_TEMP/bilipai-comment-runtime.json" --source-sha "$env:SOURCE_SHA" --comment-ui-case "$env:COMMENT_UI_CASE" `
            --output "$env:RUNNER_TEMP/bilipai-comment-search-ui"
          if ($LASTEXITCODE -ne 0) { throw 'Actual Main comment acceptance failed; inspect exact owned-window evidence.' }
      - name: Upload only the independent Main comment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Main-comment-search-evidence
          path: |
            ${{ runner.temp }}/bilipai-comment-runtime.json
            ${{ runner.temp }}/bilipai-comment-search-ui/intent.json
            ${{ runner.temp }}/bilipai-comment-search-ui/result.json
            ${{ runner.temp }}/bilipai-comment-search-ui/gradle.log
            ${{ runner.temp }}/bilipai-comment-search-ui/actual-ui/observations.json
            ${{ runner.temp }}/bilipai-comment-search-ui/actual-ui/actual-main-runtime-start.json
            ${{ runner.temp }}/bilipai-comment-search-ui/actual-ui/actual-main-runtime-end.json
            ${{ runner.temp }}/bilipai-comment-search-ui/actual-ui/local-replay-receipt.json
            ${{ runner.temp }}/bilipai-comment-search-ui/actual-ui/failure-local-replay.json
            ${{ runner.temp }}/bilipai-comment-search-ui/actual-ui/110-ordinary-playing.png
            ${{ runner.temp }}/bilipai-comment-search-ui/actual-ui/110-ordinary-playing-native.png
            ${{ runner.temp }}/bilipai-comment-search-ui/actual-ui/110-ordinary-playing-frame.txt
            ${{ runner.temp }}/bilipai-comment-search-ui/actual-ui/110-ordinary-playing-accessibility.tsv
            ${{ runner.temp }}/bilipai-comment-search-ui/actual-ui/160-original-back-home.png
            ${{ runner.temp }}/bilipai-comment-search-ui/actual-ui/160-original-back-home-frame.txt
            ${{ runner.temp }}/bilipai-comment-search-ui/actual-ui/160-original-back-home-accessibility.tsv
            ${{ runner.temp }}/bilipai-comment-search-ui/actual-ui/112-owned-player-menu.png
            ${{ runner.temp }}/bilipai-comment-search-ui/actual-ui/112-owned-player-menu-frame.txt
            ${{ runner.temp }}/bilipai-comment-search-ui/actual-ui/112-owned-player-menu-accessibility.tsv
            ${{ runner.temp }}/bilipai-comment-search-ui/actual-ui/112-owned-player-menu-popup.png
            ${{ runner.temp }}/bilipai-comment-search-ui/actual-ui/112-owned-player-menu-popup-frame.txt
            ${{ runner.temp }}/bilipai-comment-search-ui/actual-ui/112-owned-player-menu-popup-accessibility.tsv
            ${{ runner.temp }}/bilipai-comment-search-ui/actual-ui/155-original-video-back-search.png
            ${{ runner.temp }}/bilipai-comment-search-ui/actual-ui/155-original-video-back-search-frame.txt
            ${{ runner.temp }}/bilipai-comment-search-ui/actual-ui/155-original-video-back-search-accessibility.tsv
            ${{ runner.temp }}/bilipai-comment-search-ui/actual-ui/120-fullscreen-playing.png
            ${{ runner.temp }}/bilipai-comment-search-ui/actual-ui/120-fullscreen-playing-native.png
            ${{ runner.temp }}/bilipai-comment-search-ui/actual-ui/120-fullscreen-playing-frame.txt
            ${{ runner.temp }}/bilipai-comment-search-ui/actual-ui/120-fullscreen-playing-accessibility.tsv
            ${{ runner.temp }}/bilipai-comment-search-ui/actual-ui/130-fullscreen-exit-playing.png
            ${{ runner.temp }}/bilipai-comment-search-ui/actual-ui/130-fullscreen-exit-playing-native.png
            ${{ runner.temp }}/bilipai-comment-search-ui/actual-ui/130-fullscreen-exit-playing-frame.txt
            ${{ runner.temp }}/bilipai-comment-search-ui/actual-ui/130-fullscreen-exit-playing-accessibility.tsv
            ${{ runner.temp }}/bilipai-comment-search-ui/actual-ui/140-resized-playing.png
            ${{ runner.temp }}/bilipai-comment-search-ui/actual-ui/140-resized-playing-native.png
            ${{ runner.temp }}/bilipai-comment-search-ui/actual-ui/140-resized-playing-frame.txt
            ${{ runner.temp }}/bilipai-comment-search-ui/actual-ui/140-resized-playing-accessibility.tsv
            ${{ runner.temp }}/bilipai-comment-search-ui/actual-ui/150-restored-playing.png
            ${{ runner.temp }}/bilipai-comment-search-ui/actual-ui/150-restored-playing-native.png
            ${{ runner.temp }}/bilipai-comment-search-ui/actual-ui/150-restored-playing-frame.txt
            ${{ runner.temp }}/bilipai-comment-search-ui/actual-ui/150-restored-playing-accessibility.tsv
            ${{ runner.temp }}/bilipai-comment-search-ui/actual-ui/121-fullscreen-idle-hidden.png
            ${{ runner.temp }}/bilipai-comment-search-ui/actual-ui/121-fullscreen-idle-hidden-screen.png
            ${{ runner.temp }}/bilipai-comment-search-ui/actual-ui/121-fullscreen-idle-hidden-frame.txt
            ${{ runner.temp }}/bilipai-comment-search-ui/actual-ui/121-fullscreen-idle-hidden-accessibility.tsv
            ${{ runner.temp }}/bilipai-comment-search-ui/actual-ui/122-fullscreen-mouse-restored.png
            ${{ runner.temp }}/bilipai-comment-search-ui/actual-ui/122-fullscreen-mouse-restored-screen.png
            ${{ runner.temp }}/bilipai-comment-search-ui/actual-ui/122-fullscreen-mouse-restored-frame.txt
            ${{ runner.temp }}/bilipai-comment-search-ui/actual-ui/122-fullscreen-mouse-restored-accessibility.tsv
            ${{ runner.temp }}/bilipai-comment-search-ui/actual-ui/123-fullscreen-paused-hold.png
            ${{ runner.temp }}/bilipai-comment-search-ui/actual-ui/123-fullscreen-paused-hold-screen.png
            ${{ runner.temp }}/bilipai-comment-search-ui/actual-ui/123-fullscreen-paused-hold-frame.txt
            ${{ runner.temp }}/bilipai-comment-search-ui/actual-ui/123-fullscreen-paused-hold-accessibility.tsv
