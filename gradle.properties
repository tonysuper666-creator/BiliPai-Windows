# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# ========== 🚀 编译速度优化 ==========

# Gradle 保留 4GB，供依赖处理、DEX 与发布压缩使用；Kotlin 编译单独分配内存。
# -XX:+UseParallelGC: 使用并行垃圾回收，减少 GC 暂停
# 不限制 Metaspace，避免 Android/Kotlin 构建加载插件与类时触发元空间 OOM
# 水平类合并沿用 R8 默认开启；视频卡片的已知异常文件类仅在 app 保留规则中隔离。
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# 🔥 启用并行编译 - 多模块时效果显著
org.gradle.parallel=true

# 面向 16GB 开发机限制并发任务，减少编译、DEX 和资源处理同时争用内存。
# 高内存环境可通过 --max-workers 覆盖，不关闭模块并行与增量缓存。
org.gradle.workers.max=4

# 🔥 启用配置缓存 - 缓存配置阶段，增量编译更快
org.gradle.configuration-cache=true

# 🔥 多模块工程并行存取配置缓存，缩短正式版构建的配置阶段
# 如遇 Gradle 配置阶段的 ConcurrentModificationException，可单独通过
# -Dorg.gradle.configuration-cache.parallel=false 回退。
org.gradle.configuration-cache.parallel=true

# 🔥 启用构建缓存 - 缓存编译输出，跨构建复用
org.gradle.caching=true

# 🔥 文件系统监听 - 提升重复构建时的变更检测速度
org.gradle.vfs.watch=true

# ⚠️ 在配置缓存已经开启的前提下，按需配置收益很小，且更容易放大
# Kotlin/KSP 首次重建时的边缘问题，这里关闭以换取更稳定的本地编译体验。
org.gradle.configureondemand=false

# ========== Kotlin 优化 ==========

# 🔥 Kotlin 增量编译
kotlin.incremental=true

# app 的大型 Compose 编译曾在 4GB 堆下发生 Java heap space / GC overhead。
# 单独提高 Kotlin 堆上限，不把 Gradle 和 Kotlin 两个进程同时扩大。
kotlin.daemon.jvmargs=-Xmx6144m

# 🔥 KSP 增量处理 - Room 等注解处理器在小改动时可少做很多重复工作
ksp.incremental=true
ksp.incremental.intermodule=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# ========== Android 优化 ==========

# AndroidX package structure
android.useAndroidX=true


# 🔥 非传递 R 类 - 减少 R 类大小
android.nonTransitiveRClass=true

# ========== Firebase 优化 ==========

# 本地默认不上传；正式发布流程显式传入 -Pbili.firebase.uploadMapping=true。
bili.firebase.uploadMapping=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
