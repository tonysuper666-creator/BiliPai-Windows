allprojects {
    afterEvaluate { project ->
        if (project.path == ':') {
            tasks.register('exportNativeShareRuntimeClasspath') {
                doLast {
                    def entries = sourceSets.main.runtimeClasspath.files.collect { it.absolutePath }
                    file('.local/native-share-main-runtime-paths.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([entries: entries])) + '\n'
                    println('Exported current native-share ordered runtime entries: ' + entries.size())
                }
            }
        }
    }
}
