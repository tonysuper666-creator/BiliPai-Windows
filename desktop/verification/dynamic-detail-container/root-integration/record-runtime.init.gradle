import groovy.json.JsonOutput

allprojects {
    afterEvaluate { targetProject ->
        if (targetProject.name == 'bilipai-windows') {
            def outputPath = new File(targetProject.projectDir, '.local/dynamic-detail-container-main-integration/actual-main-runtime-paths.json')
            def runtimeFiles = targetProject.sourceSets.main.runtimeClasspath
            tasks.register('recordDetailRuntimeClasspath') {
                inputs.files(runtimeFiles)
                outputs.file(outputPath)
                doLast {
                    outputPath.text = JsonOutput.prettyPrint(JsonOutput.toJson([entries: runtimeFiles.files.collect { it.absolutePath }])) + '\n'
                }
            }
        }
    }
}
