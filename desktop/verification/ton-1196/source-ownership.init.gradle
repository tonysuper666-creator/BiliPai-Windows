// Read-only diagnostic of the normal production source set; no sources/tasks are replaced.
gradle.projectsEvaluated {
    def desktopProject = gradle.rootProject
    desktopProject.tasks.register('ton1196SourceOwnership') {
        doLast {
            def expected = [
                'DesktopOriginalDynamicInlineReplyUi.kt': 'build/transition-patched/com/android/purebilibili/feature/dynamic/components/DesktopOriginalDynamicInlineReplyUi.kt'
            ]
            def sources = desktopProject.extensions.getByName('kotlin').sourceSets.getByName('main').kotlin.files
            expected.each { name, relative ->
                def owners = sources.findAll { it.name == name }
                println("TON1196_OWNER ${name} count=${owners.size()}")
                owners.each { println(desktopProject.rootDir.toPath().relativize(it.toPath())) }
                assert owners.size() == 1 : "Expected exactly one compiled ${name}"
                assert owners.iterator().next().canonicalFile == desktopProject.file(relative).canonicalFile : "Unexpected compiled owner for ${name}"
            }
        }
    }
}
