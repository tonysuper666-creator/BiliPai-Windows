# The desktop compilation is the whole merged upstream tree plus the producers' output and runs
# in-process; a 4g daemon runs out of heap on a clean (uncached) compileKotlin.
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
org.gradle.caching=true
kotlin.code.style=official
